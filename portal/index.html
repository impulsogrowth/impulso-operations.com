<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal — Impulso Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:   #0A0A08;
    --teal:  #0AB5B5;
    --gold:  #C9A84C;
    --mid:   #1A1A16;
    --muted: rgba(255,255,255,0.4);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--ink); color: white;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .login-wrap {
    width: 100%; max-width: 400px;
    padding: 40px 20px;
  }
  .login-logo {
    font-family: 'Fraunces', serif;
    font-size: 20px; font-weight: 700;
    text-align: center; margin-bottom: 8px;
  }
  .login-logo em { color: var(--teal); font-style: normal; }
  .login-sub {
    text-align: center; font-size: 13px;
    color: var(--muted); margin-bottom: 40px;
  }
  .login-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 36px 32px;
  }
  .login-box h2 {
    font-family: 'Fraunces', serif;
    font-size: 24px; font-weight: 700;
    margin-bottom: 24px; letter-spacing: -0.5px;
  }
  .form-group { margin-bottom: 16px; }
  label {
    display: block; font-size: 12px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  input {
    width: 100%; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 12px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; color: white;
    outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: var(--teal); }
  input::placeholder { color: rgba(255,255,255,0.2); }
  .login-btn {
    width: 100%; background: var(--teal);
    color: var(--ink); border: none;
    padding: 14px; border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 8px;
    transition: background 0.2s, transform 0.2s;
  }
  .login-btn:hover { background: #08a0a0; transform: translateY(-1px); }
  .login-error {
    background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.2);
    border-radius: 8px; padding: 10px 14px;
    font-size: 13px; color: #ff8080;
    margin-top: 12px; display: none;
  }
  .login-footer {
    text-align: center; margin-top: 24px;
    font-size: 12px; color: rgba(255,255,255,0.2);
  }
  .login-footer a { color: var(--teal); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">Impulso <em>Operations</em></div>
  <div class="login-sub">Client Portal</div>

  <div class="login-box">
    <h2>Sign In</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@company.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="login-btn" onclick="login()">Sign In →</button>
    <div class="login-error" id="error">Invalid email or password.</div>
  </div>

  <div class="login-footer">
    Need access? <a href="mailto:nes@impulso-operations.com">Contact Nes</a>
  </div>
</div>

<script>
  // Placeholder login — will connect to Firebase auth
  function login() {
    const email = document.getElementById('email').value;
    const pass  = document.getElementById('password').value;
    const err   = document.getElementById('error');

    if (!email || !pass) { err.style.display = 'block'; err.textContent = 'Please fill in all fields.'; return; }

    // Demo credentials until Firebase is wired up
    const users = {
      'cr@impulso-operations.com':     { pass: 'cr2026',     page: 'dashboard.html?client=cr' },
      'exotic@impulso-operations.com': { pass: 'exotic2026',  page: 'dashboard.html?client=exotic' },
      'nes@impulso-operations.com':    { pass: 'admin2026',   page: 'admin.html' },
    };

    const user = users[email.toLowerCase()];
    if (user && user.pass === pass) {
      window.location.href = user.page;
    } else {
      err.style.display = 'block';
      err.textContent = 'Invalid email or password.';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
